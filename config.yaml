  - name: Malloy's Finest
    url: https://malloysfinest.com
    render: true
    product_href: /product
    search_url: https://malloysfinest.com/shop?ch-query={q}
    bottles: *bottles

  - name: Hi Proof
    url: https://www.hiproof.com
    bottles: *bottles
    # Skips bundles, multi-packs and gift sets on top of the default list.
    exclude_extra: &shopify_extra
      - bundle
      - bundles
      - combo
      - pack
      - packs
      - set
      - kit
      - sampler
      - flight
      - trio
      - duo
      - pair
      - gift
      # conditional promos, e.g. "SPEND $300 on Sazerac, get it $99.99"
      - spend
      - qualified
      - offer
      - "re:\\d*pk"
      - "re:\\d+pack"

  - name: Barrel Shoppe
    url: https://barrelshoppe.com
    bottles: *bottles
    exclude_extra: *shopify_extra

  - name: Seelbach's
