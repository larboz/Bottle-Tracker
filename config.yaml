stores:
  - name: Gold Eagle
    url: https://goldeaglewine.com
    render: true
    product_href: /product
    search_url: https://goldeaglewine.com/shop?ch-query={q}
    # One shared bottle list. Edit here and every store uses it.
    # Alternate spellings go after |. A word starting with ! rules out
    # listings with that word for that bottle only (e.g. !jr).
    bottles: &bottles
      - Weller Single Barrel
      - Weller CYPB | Weller Craft Your Perfect Bourbon
      - William Larue Weller
      - Eagle Rare 12
      - Eagle Rare 17
      - George Stagg !jr
      - Thomas Handy
      - Sazerac 18 Year
      - Rock Hill Farms
      - Taylor Single Barrel
      - Taylor Cured Oak
      - Jack Daniel's 10 Year
      - Jack Daniel's 12 Year
      - Jack Daniel's 14 Year
      - Redwood Empire Hyperion
      - Ten Pin
      - Tanager Cigar Blend
      - Maker's Mark Cellar Aged 2026

  - name: Rockton Spirits
    url: https://rocktonspirits.com
    render: true
    product_href: /product
    search_url: https://rocktonspirits.com/shop?ch-query={q}
    bottles: *bottles

  - name: DD Smoke Spirits
    url: https://ddsmokespirits.com
    render: true
    product_href: /product
    search_url: https://ddsmokespirits.com/shop?ch-query={q}
    bottles: *bottles

  - name: Royal Food & Liquor
    url: https://royalfoodliquor.com
    render: true
    product_href: /product
    search_url: https://royalfoodliquor.com/shop?ch-query={q}
    bottles: *bottles

  - name: Greene Valley
    url: https://greenevalleyws.com
    render: true
    product_href: /product
    search_url: https://greenevalleyws.com/shop?ch-query={q}
    bottles: *bottles

  - name: Garfield's Beverage
    url: https://garfieldsbeverage.com
    render: true
    product_href: /product
    search_url: https://garfieldsbeverage.com/shop?ch-query={q}
    bottles: *bottles

  - name: Joe's Beverage Warehouse
    url: https://joesbev.com
    render: true
    product_href: /product
    search_url: https://joesbev.com/shop?ch-query={q}
    bottles: *bottles

  - name: Ramirez Beverage Center
    url: https://ramirezliquor.com
    render: true
    product_href: /product
    search_url: https://ramirezliquor.com/shop?ch-query={q}
    bottles: *bottles

  - name: Hi Proof
    url: https://www.hiproof.com
    bottles: *bottles
    # Skips bundles, multi-packs and gift sets on top of the default list.
    exclude_extra: &shopify_extra
      - bundle
      - bundles
      - combo
      - pack
      - packs
      - set
      - kit
      - sampler
      - flight
      - trio
      - duo
      - pair
      - gift
      # conditional promos, e.g. "SPEND $300 on Sazerac, get it $99.99"
      - spend
      - qualified
      - offer
      - "re:\\d*pk"
      - "re:\\d+pack"

  - name: Barrel Shoppe
    url: https://barrelshoppe.com
    bottles: *bottles
    exclude_extra: *shopify_extra

  - name: Seelbach's
    url: https://seelbachs.com
    bottles: *bottles
    exclude_extra: *shopify_extra

  - name: Remedy Liquor
    url: https://www.remedyliquor.com
    bottles: *bottles
    exclude_extra: *shopify_extra

# Skip any listing priced more than this much over MSRP (0.25 = 25%).
max_over_msrp: 0.25

# Suggested retail price per bottle, keyed by the first name on its line
# above. Bottles missing here are never filtered. Researched Sept 2026.
msrp:
  Weller Single Barrel: 49.99
  Weller CYPB: 49.99
  William Larue Weller: 149.99
  Eagle Rare 12: 49.99
  Eagle Rare 17: 149.99
  George Stagg: 149.99
  Thomas Handy: 149.99
  Sazerac 18 Year: 149.99
  Rock Hill Farms: 59.99
  Taylor Single Barrel: 79.99
  Taylor Cured Oak: 79.99
  Jack Daniel's 10 Year: 84.99
  Jack Daniel's 12 Year: 94.99
  Jack Daniel's 14 Year: 149.99
  Redwood Empire Hyperion: 99.00
  Ten Pin: 124.99
  Tanager Cigar Blend: 149.00
  Maker's Mark Cellar Aged 2026: 175.00
