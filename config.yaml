stores:
  - name: Gold Eagle
    url: https://goldeaglewine.com
    render: true
    product_href: /product
    search_url: https://goldeaglewine.com/shop?ch-query={q}
    # One shared bottle list. Edit here and every store uses it.
    # Alternate spellings go after |. A word starting with ! rules out
    # listings with that word for that bottle only (e.g. !jr).
    bottles: &bottles
      - Weller Single Barrel
      - Weller CYPB | Weller Craft Your Perfect Bourbon
      - William Larue Weller
      - Eagle Rare 12
      - Eagle Rare 17
      - George Stagg !jr
      - Thomas Handy
      - Sazerac 18 Year
      - Rock Hill Farms
      - Taylor Single Barrel
      - Taylor Cured Oak
      - Jack Daniel's 10 Year
      - Jack Daniel's 12 Year
      - Jack Daniel's 14 Year
      - Redwood Empire Hyperion
      - Ten Pin
      - Tanager Cigar Blend
      - Maker's Mark Cellar Aged 2026
      - Blade and Bow Solera | Blade and Bow 12
      - Old Grand Dad Single Barrel
      - Ry3 Cigar | Ry3 Rye Cigar
      - Shortbarrel Cigar | Short Barrel Cigar
      - Remus Repeal Reserve VII | Remus Repeal Reserve 7
      - Remus Repeal Reserve VIII | Remus Repeal Reserve 8
      - Remus Repeal Reserve IX | Remus Repeal Reserve 9
      - Remus Repeal Reserve X !rye | Remus Repeal Reserve 10 !rye
      - Penelope Cigar Sessions Chapter 2 | Penelope Cigar Chapter 2 | Penelope Cigar Chapter 02 | Cigar Session Chapter2
      - Holladay Ancient Cave
      - Starlight Sakura
      - Penelope Rio

  - name: Rockton Spirits
    url: https://rocktonspirits.com
    render: true
    product_href: /product
    search_url: https://rocktonspirits.com/shop?ch-query={q}
    bottles: *bottles

