stores:
  - name: Gold Eagle
    url: https://goldeaglewine.com
    render: true
    product_href: /product
    search_url: https://goldeaglewine.com/shop?ch-query={q}
    # One shared bottle list. Edit here and both stores use it.
    bottles: &bottles
      - Weller Single Barrel
      - Weller CYPB | Weller Craft Your Perfect Bourbon
      - William Larue Weller
      - Eagle Rare 12
      - Eagle Rare 17
      - George Stagg
      - Thomas Handy
      - Sazerac 18 Year
      - Rock Hill Farms
      - Taylor Single Barrel
      - Taylor Cured Oak
      - Jack Daniel's 10 Year
      - Jack Daniel's 12 Year
      - Jack Daniel's 14 Year
      - Redwood Empire Hyperion
      - Ten Pin
      - Tanager Cigar Blend
      - Maker's Mark Cellar Aged 2026

  - name: Rockton Spirits
    url: https://rocktonspirits.com
    render: true
    product_href: /product
    search_url: https://rocktonspirits.com/shop?ch-query={q}
    bottles: *bottles

  - name: Hi Proof
    url: https://www.hiproof.com
    bottles: *bottles
    # Skips bundles, multi-packs and gift sets on top of the default list.
    exclude_extra:
      - bundle
      - bundles
      - combo
      - pack
      - packs
      - set
      - kit
      - sampler
      - flight
      - trio
      - duo
      - pair
      - gift
      # conditional promos, e.g. "SPEND $300 on Sazerac, get it $99.99"
      - spend
      - qualified
      - offer
      - "re:\\d*pk"
      - "re:\\d+pack"
