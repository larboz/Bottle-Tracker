    exclude_extra: *shopify_extra

  - name: Dram Fellows
    url: https://dramfellows.com
    bottles: *bottles
    exclude_extra: *shopify_extra

# Binny's (binnys.py, its own program and workflow). Binny's search is
# off-limits to bots, so each bottle needs its product page listed. Store
# numbers are Binny's own ids (there is no New Lenox store; Mokena is the
# closest). Shown in the page's Binny's column only.
binnys:
  stores:
    Orland Park: 47
    Joliet: 40
    Mokena: 33
  pages:
    Remus Repeal Reserve VIII: https://www.binnys.com/spirits/whiskey/george-remus-repeal-reserve-straight-bourbon-whiskey-159549/
    Remus Repeal Reserve IX: https://www.binnys.com/spirits/whiskey/george-remus-repeal-reserve-straight-bourbon-whiskey-174779/

# Bottles that show on the page but never send an email.
no_email:
  - Penelope Rio
  - Remus Repeal Reserve VII
  - Remus Repeal Reserve VIII
  - Remus Repeal Reserve IX
  - Remus Repeal Reserve X

# Skip any listing priced more than this much over MSRP (0.30 = 30%).
max_over_msrp: 0.30

# Suggested retail price per bottle, keyed by the first name on its line
# above. Bottles missing here never show at the top or email. Researched Sept 2026;
# checked against North Carolina's state store prices (abc2.nc.gov).
