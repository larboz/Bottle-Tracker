name: Bottle check
on:
  schedule:
    # UTC. Every 30 min, 8am to 9pm Chicago (CDT)
    - cron: "*/30 13-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Also started by an outside scheduler (cron-job.org), since GitHub's own
# schedule runs late or not at all. One run at a time; extras wait in line.
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # A queued run checks out the code from when it was queued. Get the
      # latest so its saved results build on the previous run's.
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python checker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Save state
        run: |
          git config user.name "bottle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json data.json
          if ! git diff --staged --quiet; then
            git commit -m "update state"
            # On a clash, keep this run's files: they are the newest.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null; sleep 5
            done
            echo "Could not save results"; exit 1
          fi
