name: Bottle check
on:
  schedule:
    # UTC. Every 30 min, 8am to 9pm Chicago (CDT)
    - cron: "*/30 13-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python checker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Save state
        run: |
          git config user.name "bottle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json data.json
          if ! git diff --staged --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
