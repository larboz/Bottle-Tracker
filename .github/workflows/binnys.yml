name: Binny's check
on:
  # Starts after every Bottle check (which cron-job.org starts), but only does
  # the check once a day: the first run after 8am Chicago time. Manual runs
  # (workflow_dispatch) always check.
  workflow_run:
    workflows: ["Bottle check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binnys
  cancel-in-progress: false

jobs:
  binnys:
    # Binny's security service challenges GitHub's servers, so this job runs
    # on Larry's Mac (a self-hosted runner) over a home connection instead.
    runs-on: [self-hosted, binnys]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # On the Mac, git sometimes doesn't pick up checkout's saved sign-in
      # ("could not read Username"), so give it this job's token directly.
      # The token only works while this job runs.
      - name: Git sign-in for this job
        env:
          TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
      - run: git pull --ff-only origin main
      - name: Once a day (manual runs always go)
        id: gate
        run: |
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          last=$(python3 -c "import json,datetime,zoneinfo; u=json.load(open('binnys.json'))['updated']; print(datetime.datetime.fromisoformat(u.replace('Z','+00:00')).astimezone(zoneinfo.ZoneInfo('America/Chicago')).date())" 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "$today" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Binny's already checked today ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Python packages (kept between runs)
        if: steps.gate.outputs.run == 'true'
        run: |
          [ -x "$HOME/.bottle-venv/bin/python" ] || python3 -m venv "$HOME/.bottle-venv"
          "$HOME/.bottle-venv/bin/pip" install -q -r requirements.txt
          "$HOME/.bottle-venv/bin/playwright" install chromium
      - run: '"$HOME/.bottle-venv/bin/python" binnys.py'
        if: steps.gate.outputs.run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Save results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "bottle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add binnys.json
          if ! git diff --staged --quiet; then
            git commit -m "update binnys"
            # On a clash, keep this run's file: it is the newest.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null; sleep 5
            done
            echo "Could not save results"; exit 1
          fi
