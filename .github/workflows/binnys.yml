name: Binny's check
on:
  # Manual only: Binny's security service challenges GitHub's servers, so
  # this doesn't run automatically from GitHub.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binnys
  cancel-in-progress: false

jobs:
  binnys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python binnys.py
      - name: Save results
        run: |
          git config user.name "bottle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add binnys.json
          if ! git diff --staged --quiet; then
            git commit -m "update binnys"
            # On a clash, keep this run's file: it is the newest.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null; sleep 5
            done
            echo "Could not save results"; exit 1
          fi
