<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>These are in!</title>
<meta name="description" content="Whiskey bottles that just showed up on local store shelves.">
<style>
  :root {
    --bg: #14100c;
    --card: #1f1912;
    --line: #35291c;
    --text: #f3e9d8;
    --muted: #a8977f;
    --amber: #e3a04a;
    --amber-dark: #c9832b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 500px at 50% -100px, #2b2013 0%, var(--bg) 60%) no-repeat, var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header { text-align: center; padding: 56px 20px 24px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.4rem, 7vw, 4rem);
    margin: 0;
    letter-spacing: .01em;
    color: var(--amber);
  }
  .sub { color: var(--muted); margin: 10px 0 0; font-size: 1.05rem; }
  .status { color: var(--muted); font-size: .9rem; margin-top: 18px; }
  .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #5fbf6a; margin-right: 8px; box-shadow: 0 0 0 0 rgba(95,191,106,.6);
    animation: pulse 2s infinite;
  }
  .dot.stale { background: #c9832b; animation: none; }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 9px rgba(95,191,106,0); }
    100% { box-shadow: 0 0 0 0 rgba(95,191,106,0); }
  }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 60px; }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--amber-dark); }
  .imgwrap {
    background: #ffffff0a; height: 240px; display: flex; align-items: center; justify-content: center;
    padding: 14px;
  }
  .imgwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .ph { font-size: 4rem; opacity: .5; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
  .meta { color: var(--muted); font-size: .9rem; }
  .price { color: var(--amber); font-weight: 700; font-size: 1.15rem; }
  .since { color: var(--muted); font-size: .8rem; margin-top: auto; padding-top: 6px; }
  .btn {
    display: block; text-align: center; text-decoration: none; margin-top: 10px;
    background: var(--amber); color: #1a1208; font-weight: 700; padding: 11px 14px;
    border-radius: 10px;
  }
  .btn:hover { background: #f0b25c; }
  .empty { text-align: center; color: var(--muted); padding: 60px 10px; font-size: 1.1rem; }
  .empty .big { font-size: 3rem; display: block; margin-bottom: 8px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 40px; }
</style>
</head>
<body>
<header>
  <h1>These are in!</h1>
  <p class="sub">Bottles on the shelf right now, straight from local stores.</p>
  <div class="status"><span id="dot" class="dot stale"></span><span id="status">Loading...</span></div>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <span class="big">&#129347;</span>
    Nothing from the list is in right now.<br>This page checks in a few times a day.
  </div>
</main>
<footer>Automatic checks about every 30 minutes. Always confirm price and stock with the store.</footer>

<script>
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var dot = document.getElementById("dot");

  function safeUrl(u) {
    return typeof u === "string" && u.indexOf("https://") === 0 ? u : "";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function ago(iso) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.round(mins / 60);
    if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    var d = Math.round(h / 24);
    return d + (d === 1 ? " day ago" : " days ago");
  }

  function card(item) {
    var c = el("article", "card");
    var wrap = el("div", "imgwrap");
    var src = safeUrl(item.image);
    if (src) {
      var img = document.createElement("img");
      img.alt = item.name || "Bottle";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onerror = function () { wrap.textContent = ""; wrap.appendChild(el("span", "ph", "\uD83E\uDD43")); };
      img.src = src;
      wrap.appendChild(img);
    } else {
      wrap.appendChild(el("span", "ph", "\uD83E\uDD43"));
    }
    c.appendChild(wrap);

    var body = el("div", "body");
    body.appendChild(el("div", "name", item.name));
    if (item.price) body.appendChild(el("div", "price", item.price));
    var meta = [item.size, item.store].filter(Boolean).join(" \u00B7 ");
    if (meta) body.appendChild(el("div", "meta", meta));
    if (item.since) body.appendChild(el("div", "since", "Spotted " + ago(item.since)));
    var link = safeUrl(item.url);
    if (link) {
      var a = el("a", "btn", "View at store");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      body.appendChild(a);
    }
    c.appendChild(body);
    return c;
  }

  function render(data) {
    grid.textContent = "";
    var items = data.items || [];
    empty.hidden = items.length > 0;
    items.forEach(function (i) { grid.appendChild(card(i)); });
    var mins = (Date.now() - new Date(data.updated).getTime()) / 60000;
    dot.className = mins > 180 ? "dot stale" : "dot";
    statusEl.textContent = items.length
      ? items.length + (items.length === 1 ? " bottle" : " bottles") + " in. Last checked " + ago(data.updated)
      : "Last checked " + ago(data.updated);
  }

  function load() {
    fetch("data.json?t=" + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { statusEl.textContent = "No data yet. Check back soon."; });
  }
  load();
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
